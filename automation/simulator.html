<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form extraction test bench</title>
<style>*{box-sizing:border-box}body{margin:0;color:#1d3044;font:16px system-ui;background:#f5f6f4}header{background:#102c40;color:white;padding:16px 5vw}header p{margin:0;color:#9dd5d3;font-size:13px}h1{font:32px Georgia;margin:4px 0}main{margin:20px auto;max-width:1450px;padding:0 4vw}nav{display:flex;align-items:end;flex-wrap:wrap;gap:12px}label{display:grid;gap:4px;font-size:13px}select,button{font:15px system-ui;padding:9px;background:white;border:1px solid #8a989f;border-radius:4px}button{background:#174e53;color:white;cursor:pointer}button:disabled{opacity:.5}article{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:27px}img{width:100%;height:auto}h2{font:23px Georgia}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;vertical-align:top;padding:6px 4px;border-bottom:1px solid #c9d3d6;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{font-weight:650}summary{cursor:pointer}#progress{color:#275b62}@media(max-width:850px){article{grid-template-columns:1fr}}</style>
<header><p>FORM-CVS 1 · CMPE 187/287</p><h1>Form extraction test bench</h1></header><main>
<nav><label>Test case<select id="case"></select></label><label>Saved evidence<select id="backend"><option value="codex-cli">Codex CLI</option><option value="chatgpt-web">ChatGPT web</option></select></label><label>Attempt<select id="rep"></select></label><button id="run">Run selected case in Codex CLI</button></nav><p id="progress" role="status"></p><article><section><h2>Image supplied to the model</h2><img id="img" alt="Generated test form"><details><summary>Prompt and image fingerprint</summary><pre id="prompt"></pre></details></section><section><h2 id="title"></h2><p id="model"></p><p id="status"></p><table><thead><tr><th>Field</th><th>Expected</th><th>Observed</th><th>Class</th></tr></thead><tbody id="fields"></tbody></table><details><summary>Complete response</summary><pre id="raw"></pre></details><pre id="fresh"></pre></section></article></main>
<script>
const el=id=>document.getElementById(id);let cases=[],records=[];
function show(){const r=records[Number(el('rep').value)||0];el('fields').replaceChildren();el('raw').textContent=r?.raw||'';if(!r||r.blocked){el('status').textContent=r?.blocked||'No recorded attempt';return}el('status').textContent=(r.score.pass?'PASS':'FAIL')+' · '+r.score.checks.filter(x=>x.ok).length+' / '+r.score.checks.length+' field checks';for(const x of r.score.checks){let row=el('fields').insertRow();for(const value of [x.key,JSON.stringify(x.expected),JSON.stringify(x.observed),x.class])row.insertCell().textContent=value;}}
async function inspect(){const c=cases.find(x=>x.id===el('case').value);el('img').src='/image?id='+c.id;el('title').textContent=c.title;el('model').textContent=c.context+' × '+c.input+' → '+c.target+'   |   '+c.requirements.join(', ');el('prompt').textContent=c.prompt+'\nSHA-256 '+c.sha256;el('fresh').textContent='';records=await(await fetch('/inspect?id='+c.id+'&backend='+el('backend').value)).json();el('rep').replaceChildren(...records.map((x,i)=>new Option('#'+x.rep,i)));show();}
async function live(){el('run').disabled=true;const id=el('case').value;el('progress').textContent='Running '+id+' in a fresh Codex CLI session…';try{const r=await(await fetch('/run?id='+id,{method:'POST',headers:{'X-Form-Simulator':'1'}})).json();el('fresh').textContent=r.log+'\nEvidence: '+r.directory+'\n'+r.receipts.map(x=>x.raw||x.infrastructure_error).join('\n');el('progress').textContent='Execution finished.'}catch(e){el('progress').textContent=String(e)}finally{el('run').disabled=false}}
el('run').onclick=live;el('case').onchange=el('backend').onchange=inspect;el('rep').onchange=show;
fetch('/cases').then(x=>x.json()).then(x=>{cases=x;el('case').replaceChildren(...x.map(c=>new Option(c.id+' · '+c.title,c.id)));inspect()});
</script></html>
